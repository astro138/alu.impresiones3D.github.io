<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sección Exclusiva +18 - Alu Impresiones 3D</title>
  <style>
    :root {
      --primary-color: #f1f1f1;
      --accent-color: #25D366;
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-main: #f1f1f1;
      --text-muted: #aaaaaa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: var(--bg-color);
      color: var(--text-main);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-volver {
      display: inline-block;
      background: #333;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      font-weight: bold;
    }

    header {
      text-align: center;
      padding: 10px 0 20px 0;
    }

    h1 { margin: 0 0 5px 0; font-size: 1.5rem; color: #ff4d4d; }
    p { color: var(--text-muted); font-size: 0.9rem; }

    .model-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    /* Galería de las 2 fotos */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .gallery img {
      width: 100%;
      height: 180px;
      border-radius: 8px;
      object-fit: cover;
      background: #222;
    }

    .model-info h3 {
      margin: 0 0 8px 0;
      font-size: 1.1rem;
    }

    .model-info p {
      margin: 0 0 15px 0;
      font-size: 0.85rem;
    }

    .btn-whatsapp {
      display: block;
      text-align: center;
      background-color: var(--accent-color);
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 3px 6px rgba(37, 211, 102, 0.3);
    }

    .tag {
      background: #ff4d4d;
      color: white;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 10px;
      font-weight: bold;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <a class="btn-volver" href="index.html">← Volver al inicio</a>

  <header>
    <h1>Catálogo Exclusivo +18 🔞</h1>
    <p>Modelos detallados y de colección bajo pedido</p>
  </header>

  <!-- Tarjeta del Modelo -->
  <div class="model-container">
    <span class="tag">Exclusivo</span>
    
    <!-- GALERÍA: Reemplaza "foto1.jpg" y "foto2.jpg" con los nombres reales de tus archivos JPG -->
    <div class="gallery">
      <img src="fnaf1.jpg" alt="Modelo +18 Vista 1">
      <img src="fnaf2.jpg" alt="Modelo +18 Vista 2">
    </div>

    <div class="model-info">
      <h3>Figura Coleccionable Personalizada</h3>
      <p>Impresión de alta precisión con acabados detallados. Disponible bajo pedido a medida.</p>
      
      <a class="btn-whatsapp" href="https://wa.me/56952340397?text=Hola!%20Vi%20el%20modelo%20exclusivo%20+18%20en%20tu%20web%20y%20me%20gustaría%20cotizarlo." target="_blank">
        💬 Cotizar este modelo por WhatsApp
      </a>
    </div>
  </div>

</body>
</html>
