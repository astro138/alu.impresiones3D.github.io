<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sección Anime - Impresiones 3D</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f8f9fa;
      color: #333;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    header {
      text-align: center;
      padding: 15px 0;
    }
    h1 { margin: 0 0 5px 0; font-size: 1.5rem; }
    .btn-volver {
      display: inline-block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .card {
      background: white;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .card img {
      width: 100%;
      height: 120px;
      border-radius: 6px;
      object-fit: cover;
      background: #eee;
    }
    .card h4 { margin: 8px 0 4px 0; font-size: 0.9rem; }
    .card p { margin: 0; font-size: 0.75rem; color: #666; }
  </style>
</head>
<body>

  <a class="btn-volver" href="index.html">← Volver al inicio</a>

  <header>
    <h1>Sección Anime & Manga 🍥</h1>
    <p>Figuras, bustos y llaveros personalizados de tus series</p>
  </header>

  <div class="grid">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=300" alt="Figura">
      <h4>Busto Detallado</h4>
      <p>Impreso en alta definición.</p>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=300" alt="Llavero">
      <h4>Llaveros de Símbolos</h4>
      <p>Ideales para regalo o eventos.</p>
    </div>
  </div>

</body>
</html>
